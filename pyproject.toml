[build-system]
requires = ["setuptools>=80.10"]
build-backend = "setuptools.build_meta"

[project]
name = "vangja"
version = "0.2.4"
description = "A time-series forecasting package with an intuitive API capable of modeling short time series with prior knowledge derived from a similar long time series."
authors = [{ name = "Jovan Krajevski", email = "jovan.krajevski@gmail.com" }, { name = "Biljana Tojtovska Ribarski", email = "biljana.tojtovska@finki.ukim.mk" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "pymc[nutpie]~=6.2",
 "scikit-learn~=1.9.0",
 "pymc-extras~=0.14.0",
 "blackjax~=1.6.2",
 # numba is a transitive dependency (via preliz); 0.63.0b1 crashes on import
 # with numpy>=2.0 (np.trapz) and <=0.66 crash with numpy>=2.5 (np.row_stack).
 # pytensor caps numba at <=0.66, so pin numba>=0.66 and numpy<2.5.
 "numba>=0.66.0",
 "numpy>=2.0,<2.5",
]

[project.urls]
Repository = "https://github.com/jovan-krajevski/vangja"
Documentation = "https://vangja.readthedocs.io"

[project.optional-dependencies]
datasets = [
    "pyreadr>=0.5.6",
    "yfinance>=1.6.0",
    "lxml>=6.1.2",
    "kagglehub>=1.0.2",
    "requests>=2.31.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.4.0",
    "myst-parser>=5.1.0",
    "nbsphinx>=0.9.8",
    "pandoc>=2.4",
    "ipykernel>=7.3.0",
]
dev = [
    "vangja[test,docs]",
    "ruff>=0.16.5",
]
reproducibility = [
    "vangja[datasets]",
    "statsmodels>=0.14.6",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
